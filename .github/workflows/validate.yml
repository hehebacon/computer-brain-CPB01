name: Validate CPB-01
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check brain.js
          node --check cognitive-core.js
          node --check reasoning-engine.js
          node --check code-workbench.js
          node --check direct-search.js
          node --check human-cognitive-systems.js
          node --check personalization.js
          node --check search-client.js
          node --check answer-synthesizer.js
          node --check worker/search-worker.js
          node --check input-engine.js
          node --check universal-representation.js
      - name: Run regression tests
        run: npm test
      - name: Check inline browser module syntax
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const html = readFileSync("index.html", "utf8");
            const blocks = [...html.matchAll(/<script type="module">([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error("No inline module script found in index.html");
            writeFileSync("/tmp/cpb01-index-inline-check.mjs", blocks[blocks.length - 1][1]);
          '
          node --check /tmp/cpb01-index-inline-check.mjs
      - name: Check build script syntax
        run: bash -n build.sh
      - name: Build static site
        run: |
          bash build.sh
          test -f dist/index.html
          test -f dist/brain.js
          test -f dist/cognitive-core.js
          test -f dist/human-cognitive-systems.js
          test -f dist/personalization.js
          test -f dist/search-client.js
          test -f dist/answer-synthesizer.js
          test -f dist/input-engine.js
          test -f dist/universal-representation.js
          test -f dist/reasoning-engine.js
          test -f dist/code-workbench.js
          test -f dist/direct-search.js
